{% extends 'base.html' %}{% block title %}Focus Balloon Pop{% endblock %}{% block content %}<main class="play focus-bg"><header class="play-head"><a href="{{url_for('dashboard',child=child.id)}}">← Dashboard</a><div>🎈 Focus Balloon Pop · {{child.name}}</div></header><section class="play-card"><div class="world">🎯</div><h1>Pop only the <span id="targetColor">BLUE</span> balloons!</h1><div class="focus-info"><span>⭐ <b id="score">0</b></span><span>❤️ <b id="lives">3</b></span><span>⏱️ <b id="timer">30</b></span></div><div id="gameArea" class="balloon-area"></div><div id="message" class="feedback"></div></section></main><script>window.GAME_CHILD={{ {'id':child.id,'name':child.name}|tojson }};</script><script src="{{url_for('static',filename='js/focus.js')}}"></script>{% endblock %}
